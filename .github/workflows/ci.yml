name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels the run it replaces. Runs on main are never cancelled midway,
# because their last job deploys to production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [Web, FileManager]
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ${{ matrix.service }}/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint:any
      - run: yarn build

      # Deploys run through docker compose, so the image must build too.
      - name: Build Docker image
        run: docker build .

  # Deploys only after every verify job passed, and only the commit that was verified.
  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /root/openecom
            git fetch origin main
            git reset --hard ${{ github.sha }}
            docker compose up -d --build
            docker image prune -f
